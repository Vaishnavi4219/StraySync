</head>

<body>

<header>
    <div class="brand">Stray<span>Sync</span></div>
    <a class="back" href="dashboard.html">← Municipal Dashboard</a>
</header>

<main>
    <h1>Verify Rescue Reports</h1>

```
<p class="subtitle">
    Review the staff rescue report and citizen feedback before approving or rejecting the completed work.
</p>

<div class="toolbar">
    <span class="count" id="reportCount" aria-live="polite">Loading reports…</span>
    <button class="refresh" id="refreshButton" type="button">↻ Refresh</button>
</div>

<div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
<section id="reports" aria-live="polite"></section>
```

</main>

<script>
(() => {
    "use strict";

    const API = "/api/verification";

    const reportsElement = document.getElementById("reports");
    const countElement = document.getElementById("reportCount");
    const noticeElement = document.getElementById("notice");
    const refreshButton = document.getElementById("refreshButton");

    function getOfficerToken() {
        return sessionStorage.getItem("straysyncOfficerToken");
    }

    function normalizeStatus(value) {
        return String(value ?? "").trim().toLowerCase();
    }

    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[char]);
    }

    function showNotice(message, type = "") {
        noticeElement.textContent = message;
        noticeElement.className = "notice " + type;
        noticeElement.hidden = false;
    }

    function hideNotice() {
        noticeElement.hidden = true;
        noticeElement.textContent = "";
    }

    function photoURL(photoPath) {
        if (!photoPath) return "";

        const value = String(photoPath).trim();

        if (value.startsWith("/uploads/")) return value;

        if (value.startsWith("uploads/")) {
            return "/" + value;
        }

        return "";
    }

    async function request(url, options = {}) {
        const token = getOfficerToken();

        if (!token) {
            throw new Error(
                "Officer login token was not found. Please log in again."
            );
        }

        const headers = {
            Authorization: "Bearer " + token,
            ...(options.body ? { "Content-Type": "application/json" } : {}),
            ...options.headers
        };

        const response = await fetch(url, {
            ...options,
            headers
        });

        const data = await response.json().catch(() => ({}));

        if (response.status === 401) {
            throw new Error("Your officer session has expired. Please log in again.");
        }

        if (response.status === 403) {
            throw new Error(
                data.message || "You are not authorized to review rescue reports."
            );
        }

        if (!response.ok || data.success === false) {
            throw new Error(
                data.message || `Request failed with status ${response.status}.`
            );
        }

        return data;
    }

    function addPhoto(container, path, description) {
        const url = photoURL(path);

        if (!url) {
            const placeholder = document.createElement("div");
            placeholder.className = "no-photo";
            placeholder.textContent = "No photo available.";
            container.appendChild(placeholder);
            return;
        }

        const img = document.createElement("img");
        img.className = "evidence";
        img.alt = description;
        img.loading = "lazy";
        img.src = url;

        img.onerror = () => {
            container.replaceChildren();

            const placeholder = document.createElement("div");
            placeholder.className = "no-photo";
            placeholder.textContent = "Photo could not be loaded.";
            container.appendChild(placeholder);
        };

        container.appendChild(img);
    }

    function createReportCard(report) {
        const card = document.createElement("article");
        card.className = "report";

        const rawStatus = String(
            report.verification_status || "Unknown"
        ).trim();

        const statusKey = normalizeStatus(rawStatus);

        const isPending = statusKey === "pending officer approval";
        const isApproved = statusKey === "approved";
        const isRejected = statusKey === "rejected";

        const statusClass = isApproved
            ? "approved"
            : isRejected
                ? "rejected"
                : "";

        card.innerHTML = `
            <div class="report-top">
                <div>
                    <h2>
                        Complaint #${escapeHTML(report.complaint_id)}
                        · Report #${escapeHTML(report.report_id ?? report.id)}
                    </h2>

                    <div class="meta">
                        ${escapeHTML(report.animal_type || "Animal")}
                        · ${escapeHTML(report.category || "General")}
                    </div>

                    <div class="meta">
                        Staff: ${escapeHTML(report.staff_name || "Staff member")}
                        ${report.employee_id ? " · " + escapeHTML(report.employee_id) : ""}
                    </div>

                    <div class="meta">
                        Submitted: ${escapeHTML(report.submitted_at || "Date unavailable")}
                    </div>

                    <div class="meta">
                        Complaint status: ${escapeHTML(report.complaint_status || "Unavailable")}
                    </div>
                </div>

                <span class="status ${statusClass}">
                    ${escapeHTML(rawStatus)}
                </span>
            </div>

            <div class="details">
                <div>
                    <span class="label">Reported issue</span>
                    <div class="description">
                        ${escapeHTML(report.complaint_description || report.description || "No complaint description.")}
                    </div>

                    <span class="label">Location</span>
                    <div class="description">
                        ${escapeHTML(report.location || "Not provided")}
                    </div>

                    <span class="label">Staff rescue report</span>
                    <div class="description">
                        ${escapeHTML(report.action_description || "No work description provided.")}
                    </div>

                    <span class="label">Citizen feedback</span>
                    <div class="citizen-feedback">
                        <div class="description">
                            ${escapeHTML(report.citizen_feedback || "Citizen feedback is not available.")}
                        </div>

                        <div class="rating">
                            Citizen rating:
                            ${report.citizen_rating
                                ? escapeHTML(report.citizen_rating) + " / 5"
                                : "Not provided"}
                        </div>

                        <div class="meta">
                            Feedback submitted:
                            ${escapeHTML(report.feedback_submitted_at || "Date unavailable")}
                        </div>
                    </div>

                    <span class="label">Officer review comments</span>
                    <textarea class="feedback" maxlength="1000"
                        placeholder="Enter comments. Required when rejecting."
                        aria-label="Officer review comments"></textarea>


                <div class="actions"></div>
            </div>

            <div>
                <span class="label">Citizen's original photo</span>
                <div class="original-photo"></div>

                <span class="label">Staff evidence photo</span>
                <div class="evidence-container"></div>
            </div>
        </div>
    `;

    addPhoto(
        card.querySelector(".original-photo"),
        report.original_photo,
        "Original complaint photograph"
    );

    addPhoto(
        card.querySelector(".evidence-container"),
        report.evidence_photo,
        "Rescue staff evidence photograph"
    );

    const actions = card.querySelector(".actions");
    const feedback = card.querySelector(".feedback");

    if (isPending) {
        const hasCitizenFeedback =
            Boolean(String(report.citizen_feedback || "").trim());

        if (!hasCitizenFeedback) {
            feedback.readOnly = true;
            feedback.value = "";

            const waitingMessage = document.createElement("div");
            waitingMessage.className = "meta";
            waitingMessage.textContent =
                "Waiting for citizen feedback. This report cannot be reviewed yet.";

            actions.appendChild(waitingMessage);
            return card;
        }

        const approveButton = document.createElement("button");
        approveButton.className = "approve";
        approveButton.textContent = "Approve & Complete";
        approveButton.type = "button";

        const rejectButton = document.createElement("button");
        rejectButton.className = "reject";
        rejectButton.textContent = "Reject Report";
        rejectButton.type = "button";

        approveButton.addEventListener("click", () => {
            reviewReport(
                report.report_id ?? report.id,
                "Approved",
                feedback,
                approveButton,
                rejectButton
            );
        });

        rejectButton.addEventListener("click", () => {
            reviewReport(
                report.report_id ?? report.id,
                "Rejected",
                feedback,
                approveButton,
                rejectButton
            );
        });

        actions.append(approveButton, rejectButton);

    } else {
        feedback.readOnly = true;
        feedback.value = report.officer_feedback || "No officer comments recorded.";

        const reviewedAt = document.createElement("div");
        reviewedAt.className = "meta";
        reviewedAt.textContent = report.reviewed_at
            ? "Reviewed: " + report.reviewed_at
            : "This report has already been reviewed.";

        actions.appendChild(reviewedAt);
    }

    return card;
}

async function loadReports() {
    refreshButton.disabled = true;
    reportsElement.replaceChildren();
    countElement.textContent = "Loading reports…";
    hideNotice();

    try {
        const data = await request(API + "/reports");

        const reports = Array.isArray(data)
            ? data
            : Array.isArray(data.reports)
                ? data.reports
                : null;

        if (!reports) {
            throw new Error(
                "The verification API did not return a reports array. Please check the backend."
            );
        }

        const pendingCount = reports.filter(report =>
            normalizeStatus(report.verification_status) === "pending officer approval"
        ).length;

        countElement.textContent =
            `${pendingCount} awaiting approval · ${reports.length} total`;

        if (reports.length === 0) {
            reportsElement.innerHTML = `
                <div class="empty">
                    <h2>No rescue reports found</h2>
                    <p>
                        Rescue reports will appear here after staff submit their work.
                    </p>
                </div>
            `;
            return;
        }

        reports.forEach(report => {
            reportsElement.appendChild(createReportCard(report));
        });

    } catch (error) {
        countElement.textContent = "Reports unavailable";
        showNotice(error.message || "Unable to load rescue reports.", "error");
    } finally {
        refreshButton.disabled = false;
    }
}

async function reviewReport(
    reportId,
    decision,
    feedbackElement,
    approveButton,
    rejectButton
) {
    if (reportId === undefined || reportId === null) {
        showNotice("This report is missing its report ID.", "error");
        return;
    }

    const feedback = feedbackElement.value.trim();

    if (decision === "Rejected" && !feedback) {
        showNotice(
            "Please enter a reason before rejecting this report.",
            "error"
        );
        feedbackElement.focus();
        return;
    }

    const confirmation = decision === "Approved"
        ? "Approve this rescue report? The complaint will be marked as Completed."
        : "Reject this rescue report? The staff member will need to correct and resubmit it.";

    if (!window.confirm(confirmation)) return;

    approveButton.disabled = true;
    rejectButton.disabled = true;
    hideNotice();

    try {
        const result = await request(
            API + "/reports/" + encodeURIComponent(reportId) + "/review",
            {
                method: "PATCH",
                body: JSON.stringify({
                    decision,
                    feedback
                })
            }
        );

        await loadReports();

        showNotice(
            result.message || (
                decision === "Approved"
                    ? "Report approved. Complaint marked as Completed."
                    : "Report rejected. Staff can correct and resubmit it."
            ),
            "success"
        );

    } catch (error) {
        showNotice(error.message || "Unable to save the review.", "error");
        approveButton.disabled = false;
        rejectButton.disabled = false;
    }
}

refreshButton.addEventListener("click", loadReports);

loadReports();


})(); </script>

</body>
</html>
